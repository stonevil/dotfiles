# vim:set ft=sh

# This is the mkinitcpio.conf file that ZFSBootMenu will read by default when creating images. The syntax is the same as an ordinary mkinitcpio.conf file, although the `zfsbootmenu` hook will recognize a few additional variables.


MODULES=(zfs)
BINARIES=()

FILES+=()

HOOKS=(base udev autodetect microcode modconf block keyboard keymap zfs filesystems zfsbootmenu)

#COMPRESSION="zstd"
#COMPRESSION="gzip"
#COMPRESSION="bzip2"
#COMPRESSION="lzma"
#COMPRESSION="xz"
#COMPRESSION="lzop"
#COMPRESSION="lz4"

#COMPRESSION_OPTIONS=()
#MODULES_DECOMPRESS="no"

# ZFSBOOTMENU OPTIONS
# The options below may be specified to control ZFSBootMenu image creation.

# zfsbootmenu_module_root
# Set this option to override the default location to the core ZFSBootMenu libraries and utilities that will be installed in the image.
#zfsbootmenu_module_root="/usr/share/zfsbootmenu"

# zfsbootmenu_miser
# mkinitcpio uses busybox to provide core utilities. However, by default, the 'zfsbootmenu' hook will install system versions of the utilities on which it depends. Most likely, your system gets these utilities from util-linux rather than busybox. Set zfsbootmenu_miser to "yes", "1" or "on" (without regard to case) to allow the module to exclude utilities that are already provided by busybox. This may shrink your ZFSBootMenu image slightly, but is not as well tested and may break some (non-essential) ZFSBootMenu features.
#zfsbootmenu_miser="no"

# zfsbootmenu_hook_root
# ZFSBootMenu supports user-provided hooks that may be run at various points in the boot process. Set zfsbootmenu_hook_root to the path of the hooks tree that includes a subdirectory for each hook point.
#zfsbootmenu_hook_root="/etc/zfsbootmenu/hooks"
